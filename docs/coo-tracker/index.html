<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COO Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07110d;
      --text: #e8f3ec;
      --muted: #93b0a2;
      --accent: #3dd68c;
      --line: #2f4a3d;
      --panel: #102019;
      --story: #6eb6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Figtree", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 40% at 12% 0%, rgba(61, 214, 140, 0.16), transparent 55%),
        var(--ink);
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
    a { color: var(--accent); }
    .back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--text); }
    header { margin-top: 1rem; }
    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    h1 span { color: var(--accent); }
    .lede { margin-top: 0.75rem; color: var(--muted); max-width: 40rem; line-height: 1.55; }
    .updated {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .switch {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      padding: 0.3rem;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .switch button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.55rem 1.15rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .switch button[aria-selected="true"] {
      background: var(--ink);
      color: var(--accent);
      outline: 1px solid rgba(61, 214, 140, 0.45);
    }
    .tabs {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.6rem;
      flex-wrap: wrap;
    }
    .tab {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 1rem;
      padding: 0.95rem 1.1rem;
      min-width: 200px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .tab[aria-selected="true"] {
      border-color: rgba(61, 214, 140, 0.7);
      outline: 1px solid rgba(61, 214, 140, 0.35);
    }
    .tab .when {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .tab .meta { margin-top: 0.3rem; color: var(--muted); font-size: 0.82rem; }
    .pill {
      display: inline-block;
      margin-top: 0.45rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.7rem;
      margin-top: 1.25rem;
    }
    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 0.9rem;
      padding: 0.85rem 0.95rem;
    }
    .stat b {
      display: block;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .stat span { color: var(--muted); font-size: 0.8rem; }
    .summary {
      margin-top: 1rem;
      color: var(--muted);
      line-height: 1.55;
      max-width: 44rem;
    }
    .section {
      margin-top: 1.4rem;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 1rem;
      padding: 1.15rem 1.2rem 1.25rem;
    }
    .section h2 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .section .status {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--story);
    }
    .section[data-id="live"] .status,
    .section[data-id="web-done"] .status { color: var(--accent); }
    .section ul {
      margin: 0.85rem 0 0 1.1rem;
      color: var(--text);
      line-height: 1.55;
    }
    .section li { margin-top: 0.55rem; }
    .section li a {
      font-size: 0.8rem;
      font-weight: 700;
      margin-left: 0.35rem;
      white-space: nowrap;
    }
    .how {
      margin-top: 1.6rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .how code { color: var(--text); font-size: 0.84rem; }
    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr; }
      .tab { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← Engineering Trackers</a>
    <header>
      <h1>COO <span>Tracker</span></h1>
      <p class="lede">
        Pick a week, then switch between App and Web frontend.
      </p>
      <p class="updated" id="updated"></p>
    </header>

    <div class="tabs" id="tabs" role="tablist" aria-label="Weeks"></div>
    <div class="switch" id="switch" role="tablist" aria-label="App or web"></div>
    <div class="stats" id="stats"></div>
    <p class="summary" id="summary"></p>
    <div id="sections"></div>
    <p class="how">
      Next week: add a new object at the top of <code>docs/coo-tracker/data.js</code> and push to <code>main</code>.
    </p>
  </div>

  <script src="data.js"></script>
  <script>
    const data = window.COO_TRACKER;
    let activeId = data.weeks[0].id;
    let stream = "app";

    const STREAMS = [
      { id: "app", label: "App" },
      { id: "web", label: "Web frontend" }
    ];

    function fmtDate(iso) {
      return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", {
        day: "numeric", month: "short", year: "numeric"
      });
    }

    function ticketLink(key) {
      if (!key) return "";
      return '<a href="' + data.jiraBase + "/" + encodeURIComponent(key) + '" target="_blank" rel="noreferrer">' + key + "</a>";
    }

    function activeWeek() {
      return data.weeks.find((week) => week.id === activeId) || data.weeks[0];
    }

    function streamSections(week) {
      return week.sections.filter((section) => (section.stream || "app") === stream);
    }

    function itemCount(week, streamId) {
      return week.sections
        .filter((section) => (section.stream || "app") === streamId)
        .reduce((n, section) => n + section.items.length, 0);
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = data.weeks.map((week) => (
        '<button class="tab" role="tab" data-id="' + week.id + '" aria-selected="' + (week.id === activeId) + '">' +
          '<div class="when">' + week.range + "</div>" +
          '<div class="meta">App ' + itemCount(week, "app") + " · Web " + itemCount(week, "web") + "</div>" +
          '<div class="pill">' + week.label + "</div>" +
        "</button>"
      )).join("");
    }

    function renderSwitch() {
      document.getElementById("switch").innerHTML = STREAMS.map((item) => (
        '<button type="button" data-stream="' + item.id + '" aria-selected="' + (item.id === stream) + '">' +
          item.label +
        "</button>"
      )).join("");
    }

    function renderStats(sections) {
      document.getElementById("stats").innerHTML = sections.map((section) => (
        '<div class="stat"><b>' + section.status + "</b><span>" + section.title + "</span></div>"
      )).join("");
    }

    function renderSections(week, sections) {
      const summary = stream === "web" ? week.summaryWeb : week.summaryApp;
      document.getElementById("summary").textContent = summary || week.summary || "";
      document.getElementById("sections").innerHTML = sections.map((section) => (
        '<section class="section" data-id="' + section.id + '">' +
          "<h2>" + section.title + "</h2>" +
          '<div class="status">' + section.status + "</div>" +
          "<ul>" +
            section.items.map((item) => (
              "<li>" + item.what + (item.key ? " " + ticketLink(item.key) : "") + "</li>"
            )).join("") +
          "</ul>" +
        "</section>"
      )).join("");
    }

    function render() {
      const week = activeWeek();
      const sections = streamSections(week);
      document.getElementById("updated").textContent = "Updated " + fmtDate(data.updated);
      renderTabs();
      renderSwitch();
      renderStats(sections);
      renderSections(week, sections);
    }

    document.getElementById("tabs").addEventListener("click", (event) => {
      const tab = event.target.closest(".tab");
      if (!tab) return;
      activeId = tab.dataset.id;
      render();
    });

    document.getElementById("switch").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-stream]");
      if (!btn) return;
      stream = btn.dataset.stream;
      render();
    });

    render();
  </script>
</body>
</html>
