<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COO Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07110d;
      --text: #e8f3ec;
      --muted: #93b0a2;
      --accent: #3dd68c;
      --line: #2f4a3d;
      --panel: #102019;
      --story: #6eb6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Figtree", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 40% at 12% 0%, rgba(61, 214, 140, 0.16), transparent 55%),
        var(--ink);
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
    a { color: var(--accent); }
    .back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--text); }
    header { margin-top: 1rem; }
    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    h1 span { color: var(--accent); }
    .lede { margin-top: 0.75rem; color: var(--muted); max-width: 40rem; line-height: 1.55; }
    .updated {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .empty {
      margin-top: 1.2rem;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 1rem;
      padding: 1rem 1.1rem;
    }
    .switch {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
      padding: 0.3rem;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .switch button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.55rem 1.15rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .switch button[aria-selected="true"] {
      background: var(--ink);
      color: var(--accent);
      outline: 1px solid rgba(61, 214, 140, 0.45);
    }
    .tabs {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.6rem;
      flex-wrap: wrap;
    }
    .tabs.is-off { display: none; }
    .tab {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 1rem;
      padding: 0.95rem 1.1rem;
      min-width: 200px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .tab[aria-selected="true"] {
      border-color: rgba(61, 214, 140, 0.7);
      outline: 1px solid rgba(61, 214, 140, 0.35);
    }
    .tab .when {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .tab .meta { margin-top: 0.3rem; color: var(--muted); font-size: 0.82rem; }
    .pill {
      display: inline-block;
      margin-top: 0.45rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.7rem;
      margin-top: 1.25rem;
    }
    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 0.9rem;
      padding: 0.85rem 0.95rem;
    }
    .stat b {
      display: block;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .stat span { color: var(--muted); font-size: 0.8rem; }
    .summary {
      margin-top: 1rem;
      color: var(--muted);
      line-height: 1.55;
      max-width: 44rem;
    }
    .section {
      margin-top: 1.4rem;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 1rem;
      padding: 1.15rem 1.2rem 1.25rem;
    }
    .section h2 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .section .status {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--story);
    }
    .section[data-id="live"] .status,
    .section[data-id="web-done"] .status,
    .section[data-id="web-live"] .status,
    .section[data-id="revamp-done"] .status { color: var(--accent); }
    .section[data-id="web-built"] .status,
    .section[data-id="tpap"] .status { color: var(--story); }
    .section[data-id="revamp-queued"] .status { color: var(--muted); }
    .sheet-link { font-size: 0.88rem; }
    .section ul {
      margin: 0.85rem 0 0 1.1rem;
      color: var(--text);
      line-height: 1.55;
    }
    .section li { margin-top: 0.55rem; }
    .section li a {
      font-size: 0.8rem;
      font-weight: 700;
      margin-left: 0.35rem;
      white-space: nowrap;
    }
    .how {
      margin-top: 1.6rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .how code { color: var(--text); font-size: 0.84rem; }
    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr; }
      .tab { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← Engineering Trackers</a>
    <header>
      <h1>COO <span>Tracker</span></h1>
      <p class="lede">
        Choose App, Web frontend, or App revamp.
      </p>
      <p class="updated" id="updated"></p>
    </header>

    <div class="switch" id="switch" role="tablist" aria-label="App, web, or revamp"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Weeks"></div>
    <div class="stats" id="stats"></div>
    <p class="summary" id="summary"></p>
    <div id="sections"></div>
    <p class="how">
      App and web: add a new week at the top of <code>docs/coo-tracker/data.js</code>.
      App revamp follows the module Google Sheet.
    </p>
  </div>

  <script src="data.js?v=2026-08-24-tpap"></script>
  <script>
    const data = window.COO_TRACKER;
    if (!data || !data.weeks || !data.weeks.length) {
      document.getElementById("summary").textContent =
        "Tracker data did not load. Refresh, or open /coo-tracker/ with the trailing slash.";
    } else {
    const hashStream = (location.hash || "").replace("#", "");
    let activeId = data.weeks[0].id;
    let stream = hashStream === "web" || hashStream === "revamp" ? hashStream : "app";
    let revampRows = (data.revamp && data.revamp.rows) ? data.revamp.rows.slice() : [];
    let revampLive = false;

    const STREAMS = [
      { id: "app", label: "App" },
      { id: "web", label: "Web frontend" },
      { id: "revamp", label: "App revamp" }
    ];

    function fmtDate(iso) {
      return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", {
        day: "numeric", month: "short", year: "numeric"
      });
    }

    function ticketLink(key) {
      if (!key) return "";
      return '<a href="' + data.jiraBase + "/" + encodeURIComponent(key) + '" target="_blank" rel="noreferrer">' + key + "</a>";
    }

    function activeWeek() {
      return data.weeks.find((week) => week.id === activeId) || data.weeks[0];
    }

    function sectionStream(section) {
      if (section.stream === "web" || section.stream === "app") return section.stream;
      const id = String(section.id || "");
      const title = String(section.title || "");
      if (id.indexOf("web") === 0 || /web|frontend|website/i.test(title)) return "web";
      return "app";
    }

    function streamSections(week) {
      return week.sections.filter((section) => sectionStream(section) === stream);
    }

    function itemCount(week, streamId) {
      if (streamId === "revamp") return revampRows.length;
      return week.sections
        .filter((section) => sectionStream(section) === streamId)
        .reduce((n, section) => n + (section.items ? section.items.length : 0), 0);
    }

    function statusBucket(status) {
      const value = String(status || "").trim().toLowerCase();
      if (value === "done" || value === "complete" || value === "completed") return "done";
      if (value === "in progress" || value === "in-progress" || value === "wip" || value === "qa") return "progress";
      return "queued";
    }

    function rowLabel(row) {
      const moduleName = String(row.module || "").trim();
      const sub = String(row.sub || "").trim();
      if (moduleName && sub) return moduleName + " — " + sub;
      return moduleName || sub;
    }

    function normalizeRevampRows(rows) {
      const out = [];
      let lastModule = "";
      (rows || []).forEach((row) => {
        const rawModule = String(row.module || "").trim();
        const sub = String(row.sub || "").trim();
        if (rawModule) lastModule = rawModule;
        const moduleName = rawModule || lastModule;
        if (!moduleName && !sub) return;
        out.push({
          module: moduleName,
          sub: sub,
          key: String(row.key || "").trim(),
          status: String(row.status || "").trim() || "Not started"
        });
      });
      return out;
    }

    function revampCounts() {
      const counts = { done: 0, progress: 0, queued: 0 };
      revampRows.forEach((row) => { counts[statusBucket(row.status)] += 1; });
      return counts;
    }

    function revampSections() {
      const groups = {
        done: { id: "revamp-done", title: "Done", status: "Rebuild complete", items: [] },
        progress: { id: "revamp-progress", title: "In progress", status: "Being rebuilt", items: [] },
        queued: { id: "revamp-queued", title: "Not started", status: "Queued", items: [] }
      };
      revampRows.forEach((row) => {
        groups[statusBucket(row.status)].items.push({
          what: rowLabel(row),
          key: row.key
        });
      });
      return ["done", "progress", "queued"].map((key) => groups[key]).filter((section) => section.items.length);
    }

    function rowsFromGviz(res) {
      if (!res || !res.table || !res.table.cols || !res.table.rows) return [];
      const labels = res.table.cols.map((col) => String((col && (col.label || col.id)) || "").toLowerCase());
      function idx(names) {
        for (let i = 0; i < names.length; i += 1) {
          const found = labels.indexOf(names[i]);
          if (found >= 0) return found;
        }
        return -1;
      }
      const moduleIdx = idx(["module name", "module"]);
      const subIdx = idx(["sub module name", "submodule", "sub module"]);
      const jiraIdx = idx(["jira", "ticket", "key"]);
      const statusIdx = idx(["status"]);
      function cell(row, index) {
        if (index < 0 || !row.c || !row.c[index] || row.c[index].v == null) return "";
        return String(row.c[index].v).trim();
      }
      return normalizeRevampRows(res.table.rows.map((row) => ({
        module: cell(row, moduleIdx),
        sub: cell(row, subIdx),
        key: cell(row, jiraIdx),
        status: cell(row, statusIdx)
      })));
    }

    function htmlList(sections) {
      return sections.map((section) => (
        '<section class="section" data-id="' + section.id + '">' +
          "<h2>" + section.title + "</h2>" +
          '<div class="status">' + section.status + "</div>" +
          "<ul>" +
            (section.items || []).map((item) => (
              "<li>" + item.what + (item.key ? " " + ticketLink(item.key) : "") + "</li>"
            )).join("") +
          "</ul>" +
        "</section>"
      )).join("");
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      tabs.classList.toggle("is-off", stream === "revamp");
      tabs.innerHTML = data.weeks.map((week) => (
        '<button class="tab" role="tab" data-id="' + week.id + '" aria-selected="' + (week.id === activeId) + '">' +
          '<div class="when">' + week.range + "</div>" +
          '<div class="meta">App ' + itemCount(week, "app") + " · Web " + itemCount(week, "web") + "</div>" +
          '<div class="pill">' + week.label + "</div>" +
        "</button>"
      )).join("");
    }

    function renderSwitch() {
      const week = activeWeek();
      document.getElementById("switch").innerHTML = STREAMS.map((item) => (
        '<button type="button" data-stream="' + item.id + '" aria-selected="' + (item.id === stream) + '">' +
          item.label + " (" + itemCount(week, item.id) + ")" +
        "</button>"
      )).join("");
    }

    function renderStats(sections) {
      document.getElementById("stats").innerHTML = sections.map((section) => (
        '<div class="stat"><b>' + section.status + "</b><span>" + section.title + "</span></div>"
      )).join("");
    }

    function renderWeekView(week, sections) {
      const summary = stream === "web" ? week.summaryWeb : week.summaryApp;
      document.getElementById("summary").textContent = summary || week.summary || "";
      if (!sections.length) {
        document.getElementById("sections").innerHTML =
          '<p class="empty">No ' + (stream === "web" ? "web frontend" : "app") + " updates in this week.</p>";
        return;
      }
      document.getElementById("sections").innerHTML = htmlList(sections);
    }

    function renderRevampView() {
      const counts = revampCounts();
      const sheetUrl = data.revamp && data.revamp.sheetUrl ? data.revamp.sheetUrl : "";
      const source = revampLive
        ? "Live from the module sheet."
        : "Snapshot from the module sheet (" + fmtDate((data.revamp && data.revamp.pulled) || data.updated) + ").";
      document.getElementById("summary").innerHTML =
        (data.revamp && data.revamp.summary ? data.revamp.summary + " " : "") +
        source +
        (sheetUrl ? ' <a class="sheet-link" href="' + sheetUrl + '" target="_blank" rel="noreferrer">Open sheet</a>' : "");
      renderStats([
        { title: "Done", status: String(counts.done) },
        { title: "In progress", status: String(counts.progress) },
        { title: "Not started", status: String(counts.queued) }
      ]);
      const sections = revampSections();
      document.getElementById("sections").innerHTML = sections.length
        ? htmlList(sections)
        : '<p class="empty">No app revamp modules in the sheet yet.</p>';
    }

    function render() {
      document.getElementById("updated").textContent = "Updated " + fmtDate(data.updated);
      renderSwitch();
      renderTabs();
      if (stream === "revamp") {
        renderRevampView();
        return;
      }
      const week = activeWeek();
      const sections = streamSections(week);
      renderStats(sections);
      renderWeekView(week, sections);
    }

    function loadRevampSheet() {
      if (!data.revamp || !data.revamp.sheetId) return;
      window.google = window.google || {};
      window.google.visualization = window.google.visualization || {};
      window.google.visualization.Query = window.google.visualization.Query || {};
      window.google.visualization.Query.setResponse = function (res) {
        const rows = rowsFromGviz(res);
        if (!rows.length) return;
        revampRows = rows;
        revampLive = true;
        render();
      };
      const script = document.createElement("script");
      script.src = "https://docs.google.com/spreadsheets/d/" +
        encodeURIComponent(data.revamp.sheetId) +
        "/gviz/tq?gid=" + encodeURIComponent(data.revamp.gid || "0") +
        "&tqx=out:json";
      document.body.appendChild(script);
    }

    document.getElementById("tabs").addEventListener("click", (event) => {
      const tab = event.target.closest(".tab");
      if (!tab) return;
      activeId = tab.dataset.id;
      render();
    });

    document.getElementById("switch").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-stream]");
      if (!btn) return;
      stream = btn.dataset.stream;
      location.hash = stream;
      render();
    });

    revampRows = normalizeRevampRows(revampRows);
    render();
    loadRevampSheet();
    }
  </script>
</body>
</html>
