<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COO Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07110d;
      --text: #e8f3ec;
      --muted: #93b0a2;
      --accent: #3dd68c;
      --line: #2f4a3d;
      --panel: #102019;
      --story: #6eb6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Figtree", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 40% at 12% 0%, rgba(61, 214, 140, 0.16), transparent 55%),
        var(--ink);
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
    a { color: var(--accent); }
    .back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    .back:hover { color: var(--text); }
    header { margin-top: 1rem; }
    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(2rem, 5vw, 3.1rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    h1 span { color: var(--accent); }
    .lede { margin-top: 0.75rem; color: var(--muted); max-width: 40rem; line-height: 1.55; }
    .updated {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .empty {
      margin-top: 1.2rem;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 1rem;
      padding: 1rem 1.1rem;
    }
    .months {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
    }
    .months button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 0.65rem 1.15rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .months button[aria-selected="true"] {
      color: var(--accent);
      border-color: rgba(61, 214, 140, 0.7);
      outline: 1px solid rgba(61, 214, 140, 0.35);
    }
    .months.is-off { display: none; }
    .switch {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.25rem;
      padding: 0.3rem;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
    }
    .switch button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.55rem 1.15rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .switch button[aria-selected="true"] {
      background: var(--ink);
      color: var(--accent);
      outline: 1px solid rgba(61, 214, 140, 0.45);
    }
    .tabs {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.6rem;
      flex-wrap: wrap;
    }
    .tabs.is-off { display: none; }
    .tab {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 1rem;
      padding: 0.95rem 1.1rem;
      min-width: 200px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .tab[aria-selected="true"] {
      border-color: rgba(61, 214, 140, 0.7);
      outline: 1px solid rgba(61, 214, 140, 0.35);
    }
    .tab .when {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .tab .meta { margin-top: 0.3rem; color: var(--muted); font-size: 0.82rem; }
    .pill {
      display: inline-block;
      margin-top: 0.45rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.7rem;
      margin-top: 1.25rem;
    }
    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 0.9rem;
      padding: 0.85rem 0.95rem;
    }
    .stat b {
      display: block;
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .stat span { color: var(--muted); font-size: 0.8rem; }
    .summary {
      margin-top: 1rem;
      color: var(--muted);
      line-height: 1.55;
      max-width: 44rem;
    }
    .section {
      margin-top: 1.4rem;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 1rem;
      padding: 1.15rem 1.2rem 1.25rem;
    }
    .section h2 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .section .status {
      display: inline-block;
      margin-top: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--story);
    }
    .section[data-id="done"] .status,
    .section[data-id="highlights"] .status { color: var(--accent); }
    .section[data-id="progress"] .status,
    .section[data-id="design"] .status { color: var(--story); }
    .sheet-link { font-size: 0.88rem; }
    .section ul {
      margin: 0.85rem 0 0 1.1rem;
      color: var(--text);
      line-height: 1.55;
    }
    .section li { margin-top: 0.55rem; }
    .section li a {
      font-size: 0.8rem;
      font-weight: 700;
      margin-left: 0.35rem;
      white-space: nowrap;
    }
    .how {
      margin-top: 1.6rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .how code { color: var(--text); font-size: 0.84rem; }
    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr; }
      .tab { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← Engineering Trackers</a>
    <header>
      <h1>COO <span>Tracker</span></h1>
      <p class="lede">
        From the Weekly Reports sheet. Pick a month, then the week. Weeks with nothing on the sheet stay hidden.
      </p>
      <p class="updated" id="updated"></p>
    </header>

    <div class="months" id="months" role="tablist" aria-label="Months"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Weeks"></div>
    <div class="stats" id="stats"></div>
    <p class="summary" id="summary"></p>
    <div id="sections"></div>
    <p class="how">
      Weeks come from dates on the Weekly Reports sheet. A week with no rows is not shown.
    </p>
  </div>

  <script src="data.js?v=2026-11-02-last-oct"></script>
  <script>
    const data = window.COO_TRACKER;
    if (!data || !data.weeks || !data.weeks.length) {
      document.getElementById("summary").textContent =
        "Tracker data did not load. Refresh, or open /coo-tracker/ with the trailing slash.";
    } else {
    let activeMonth = "2026-10";
    let activeId = "";

    function fmtDate(iso) {
      return new Date(iso + "T00:00:00").toLocaleDateString("en-IN", {
        day: "numeric", month: "short", year: "numeric"
      });
    }

    function ticketLink(key) {
      if (!key) return "";
      return '<a href="' + data.jiraBase + "/" + encodeURIComponent(key) + '" target="_blank" rel="noreferrer">' + key + "</a>";
    }

    function weekHasUpdates(week) {
      const highlights = week.highlights ? week.highlights.length : 0;
      const items = (week.sections || []).reduce((n, section) => n + (section.items ? section.items.length : 0), 0);
      return highlights + items > 0;
    }

    function monthKey(week) {
      return week.month || String(week.id || "").slice(0, 7);
    }

    function monthLabel(key) {
      const parts = String(key).split("-");
      const date = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
      return date.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    }

    function months() {
      const seen = [];
      data.weeks.forEach((week) => {
        if (!weekHasUpdates(week)) return;
        const key = monthKey(week);
        if (seen.indexOf(key) === -1) seen.push(key);
      });
      seen.sort();
      const october = seen.indexOf("2026-10");
      if (october > 0) {
        seen.splice(october, 1);
        seen.unshift("2026-10");
      }
      return seen;
    }

    function weeksInMonth(key) {
      return data.weeks
        .filter((week) => monthKey(week) === key && weekHasUpdates(week))
        .sort((a, b) => a.id.localeCompare(b.id));
    }

    function activeWeek() {
      return data.weeks.find((week) => week.id === activeId) || weeksInMonth(activeMonth)[0] || data.weeks[0];
    }

    function itemCount(week) {
      return (week.sections || []).reduce((n, section) => n + (section.items ? section.items.length : 0), 0);
    }

    function htmlList(sections) {
      return sections.map((section) => (
        '<section class="section" data-id="' + section.id + '">' +
          "<h2>" + section.title + "</h2>" +
          '<div class="status">' + section.status + "</div>" +
          "<ul>" +
            (section.items || []).map((item) => (
              "<li>" + item.what + (item.key ? " " + ticketLink(item.key) : "") + "</li>"
            )).join("") +
          "</ul>" +
        "</section>"
      )).join("");
    }

    function renderMonths() {
      document.getElementById("months").innerHTML = months().map((key) => (
        '<button type="button" role="tab" data-month="' + key + '" aria-selected="' + (key === activeMonth) + '">' +
          monthLabel(key) +
        "</button>"
      )).join("");
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = weeksInMonth(activeMonth).map((week) => (
        '<button class="tab" role="tab" data-id="' + week.id + '" aria-selected="' + (week.id === activeId) + '">' +
          '<div class="when">' + week.range + "</div>" +
          '<div class="meta">' + itemCount(week) + " updates</div>" +
        "</button>"
      )).join("");
    }

    function renderStats(sections) {
      document.getElementById("stats").innerHTML = sections.map((section) => (
        '<div class="stat"><b>' + section.status + "</b><span>" + section.title + "</span></div>"
      )).join("");
    }

    function renderWeek(week) {
      const sections = week.sections || [];
      document.getElementById("summary").textContent = week.summary || "";
      const points = week.highlights || [];
      const highlightBlock = points.length
        ? '<section class="section" data-id="highlights">' +
            "<h2>This week</h2>" +
            '<div class="status">' + week.range + "</div>" +
            "<ul>" + points.map((point) => "<li>" + point + "</li>").join("") + "</ul>" +
          "</section>"
        : "";
      document.getElementById("sections").innerHTML = highlightBlock + htmlList(sections);
      renderStats(sections);
    }

    function render() {
      if (months().indexOf(activeMonth) === -1) activeMonth = months()[0];
      const weeks = weeksInMonth(activeMonth);
      if (!weeks.some((week) => week.id === activeId)) {
        activeId = weeks.length ? weeks[weeks.length - 1].id : "";
      }
      document.getElementById("updated").textContent = "Updated " + fmtDate(data.updated);
      renderMonths();
      renderTabs();
      renderWeek(activeWeek());
    }

    document.getElementById("months").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-month]");
      if (!btn) return;
      activeMonth = btn.dataset.month;
      const weeks = weeksInMonth(activeMonth);
      activeId = weeks.length ? weeks[weeks.length - 1].id : "";
      render();
    });

    document.getElementById("tabs").addEventListener("click", (event) => {
      const tab = event.target.closest(".tab");
      if (!tab) return;
      activeId = tab.dataset.id;
      render();
    });

    render();
    }
  </script>
</body>
</html>
